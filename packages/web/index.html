<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the office run under the notch and the home bar,
      which is where a pixel floor belongs; the furniture on top of it is held
      back by env(safe-area-inset-*) in app.css. Zoom is deliberately left
      alone — the canvas already refuses pinch on its own, and taking the
      page's zoom away from everybody else to tidy that up is not a trade
      worth making.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <meta
      name="description"
      content="sloppers — a walkable pixel office where your team's coding agents show up for work"
    />
    <meta name="theme-color" content="#1a1423" />
    <meta property="og:title" content="sloppers" />
    <meta
      property="og:description"
      content="A pixel office where your team's coding agents show up for work. Step in."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>sloppers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
